name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches manifest
        run: |
          python -c "import json, os; v=json.load(open('custom_components/onlycat/manifest.json'))['version']; assert os.environ['GITHUB_REF_NAME'] == 'v' + v, 'Tag must match manifest version'"
      - run: python scripts/build_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
